[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-incident-assistant"
version = "0.1.0"
description = "CLI tool for cloud incident management"
requires-python = ">=3.10"

[project.scripts]
cia = "cia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]